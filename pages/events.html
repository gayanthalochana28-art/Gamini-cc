<body data-page="events" data-base="../" data-chrome="site">
<a class="skip-link" href="#main">Skip to main content</a>

<main id="main">
  <section class="page-head">
    <div class="container page-head__inner">
      <img class="page-head__crest" src="../assets/logo.png" alt="Official crest of Sri Gamini Central College" width="74" height="74">
      <div>
        <p class="crumb"><a href="../index.html" data-i18n="nav.home">Home</a> · <span data-i18n="nav.events">Events</span></p>
        <h1>Events &amp; School Diary</h1>
        <p>Inter-house meetings, prize giving, colour sessions, alumni days and every date the college keeps.</p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <p class="muted" id="eventCount" style="font-size:.85rem"></p>
      <div class="tabs" id="evTabs" role="tablist" aria-label="Event views">
        <button class="tab is-active" role="tab" aria-selected="true" data-tab="up">Upcoming</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="cal">Calendar</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="past">Past events</button>
      </div>
      <div class="tab-panel is-active" data-panel="up" role="tabpanel">
        <div class="notice-list" id="evUpcoming" style="margin-top:var(--sp-4)"></div>
      </div>
      <div class="tab-panel" data-panel="cal" role="tabpanel">
        <div id="evCalendar" style="margin-top:var(--sp-4)"></div>
      </div>
      <div class="tab-panel" data-panel="past" role="tabpanel">
        <div class="notice-list" id="evPast" style="margin-top:var(--sp-4)"></div>
      </div>
    </div>
  </section>
</main>
