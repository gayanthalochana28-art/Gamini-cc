<body data-page="notices" data-base="../" data-chrome="site">
<a class="skip-link" href="#main">Skip to main content</a>

<main id="main">
  <section class="page-head">
    <div class="container page-head__inner">
      <img class="page-head__crest" src="../assets/logo.png" alt="Official crest of Sri Gamini Central College" width="74" height="74">
      <div>
        <p class="crumb"><a href="../index.html" data-i18n="nav.home">Home</a> · <span data-i18n="nav.notices">Notices</span></p>
        <h1>School Notices</h1>
        <p>Official announcements from the principal&rsquo;s office. Important and urgent notices are pinned first.</p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="toolbar">
        <div class="toolbar__grow">
          <label class="sr-only" for="fSearch">Search notices</label>
          <input class="input" id="fSearch" type="search" placeholder="Search all notices…" autocomplete="off">
        </div>
        <div><label class="sr-only" for="fCat">Filter by category</label><select class="select" id="fCat"></select></div>
        <div><label class="sr-only" for="fPri">Filter by priority</label><select class="select" id="fPri"></select></div>
      </div>
      <div class="chips" id="noticeChips" style="margin-bottom:var(--sp-3)"></div>
      <p class="muted" id="noticeCount" style="font-size:.85rem;margin-bottom:var(--sp-3)"></p>
      <div class="notice-list" id="noticeResults"></div>
      <div class="pager" id="noticePager"></div>
    </div>
  </section>

  <section class="section section--cream" id="archive" aria-labelledby="arcH">
    <div class="container">
      <div class="section-head"><span class="eyebrow">Past circulars</span><h2 class="section-title" id="arcH">Notice archive</h2>
        <p class="section-sub">Notices whose expiry date has passed remain available for reference.</p></div>
      <div class="notice-list" id="noticeArchive"></div>
    </div>
  </section>
</main>
