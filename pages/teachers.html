<main id="main">
  <section class="page-head">
    <div class="container page-head__inner">
      <img class="page-head__crest" src="../assets/logo.png" alt="Official crest of Sri Gamini Central College" width="74" height="74">
      <div>
        <p class="crumb"><a href="../index.html" data-i18n="nav.home">Home</a> · <span data-i18n="nav.teachers">Teachers</span></p>

        <p>A hundred and four teaching staff, headed by senior teachers for each department. Search by name, subject or department.</p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="toolbar">
        <div class="toolbar__grow">
          <label class="sr-only" for="teacherSearch">Search teaching staff</label>
          <input class="input" id="teacherSearch" type="search" placeholder="Search by name, subject or department…" autocomplete="off">
        </div>
        <div><label class="sr-only" for="teacherSubject">Filter by subject</label>
          <select class="select" id="teacherSubject"><option value="">All subjects</option></select></div>
        <div><label class="sr-only" for="teacherDept">Filter by department</label>
          <select class="select" id="teacherDept"><option value="">All departments</option></select></div>
        <button class="btn btn--ghost" id="teacherClear" type="button" hidden>Clear filters</button>
      </div>
      <p class="muted" id="teacherCount" style="font-size:.85rem"></p>
      <div class="grid grid-3" id="teacherGrid"></div>
    </div>
  </section>
