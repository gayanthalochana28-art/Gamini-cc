<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6E172D">
<title>My Profile | Sri Gamini Central College</title>
<meta name="description" content="Signed-in profile for students, teachers and the administration office of Sri Gamini Central College.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="512x512" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="profile" data-base="" data-chrome="dash" data-loader="off">
<a class="skip-link" href="#profileMain">Skip to profile content</a>

<div class="dash">
  <!-- ---------------- sidebar ---------------- -->
  <aside class="side" id="dashSide" aria-label="Account navigation">
    <div class="side__brand">
      <img src="assets/logo.png" alt="College crest">
      <span><strong id="sideSchool">SGCC</strong><small>My profile</small></span>
      <button class="side__x" data-burger aria-label="Close menu">✕</button>
    </div>
    <div class="side__me">
      <span id="sideAvatar"></span>
      <div><b id="sideName">Signed in</b><span id="sideMeta">—</span></div>
    </div>
    <nav class="side__nav">
      <p class="side__label">This page</p>
      <span class="side__link is-active"><i aria-hidden="true">👤</i>My Profile</span>
      <p class="side__label">Go elsewhere</p>
      <a class="side__link" href="index.html" id="pfHomeLink"><i aria-hidden="true">▦</i>My dashboard</a>
      <a class="side__link" href="index.html"><i aria-hidden="true">↩</i>Back to website</a>
      <p class="side__label">Account</p>
      <button class="side__link" data-logout type="button"><i aria-hidden="true">⏻</i>Logout</button>
    </nav>
    <div class="side__foot">
      <span class="lang-switch" role="group" aria-label="Language">
        <button data-lang="en" type="button">EN</button><button data-lang="si" type="button">සිං</button>
      </span>
      <button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode">☾</button>
    </div>
  </aside>
  <div class="scrim" id="navScrim" data-burger></div>

  <!-- ---------------- main ---------------- -->
  <div class="main">
    <header class="topbar">
      <button class="topbar__burger" data-burger aria-label="Open menu">☰</button>
      <div class="topbar__title"><span data-view-title>My Profile</span><small id="topDate"></small></div>
      <span class="topbar__sp"></span>
      <a class="topbar__user" href="profile.html" id="topUser" title="Open my profile"></a>
    </header>

    <main class="content" id="dashMain">
      <div id="profileMain" aria-live="polite"></div>
    </main>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/backend.js"></script>
<script src="js/notices.js"></script>
<script src="js/updates.js"></script>
<script src="js/events.js"></script>
<script src="js/gallery.js"></script>
<script src="js/pages.js"></script>
<script src="js/dash.js"></script>
<script src="js/profile.js"></script>
<script src="js/app.js"></script>
</body>
</html>
